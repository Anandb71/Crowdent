[project]
name = "stilldot"
version = "0.1.0"
description = "Offline smartphone dead-reckoning demo for SIH26168 — speed from motion, physics in the filter"
readme = "README.md"
authors = [{ name = "SIH26168" }]
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = ["dead-reckoning", "imu", "inertial-navigation", "smartphone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
stilldot = "stilldot.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["stilldot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stilldot"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "RUF012", "RUF043", "SIM117"]

[tool.mypy]
python_version = "3.13"
packages = ["stilldot"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true
