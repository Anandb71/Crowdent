[project]
name = "crowdent"
version = "0.1.0"
description = "Offline, uncertainty-aware crowd-crush forecasting and intervention decision support"
readme = "README.md"
authors = [
    { name = "Crowdent contributors" }
]
requires-python = ">=3.13"
license = "Apache-2.0"
keywords = [
    "crowd-safety",
    "disaster-management",
    "computer-vision",
    "sensor-fusion",
    "forecasting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
crowdent = "crowdent.cli:app"

[project.optional-dependencies]
training = [
    "onnx>=1.22.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["crowdent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crowdent"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "RUF012", "RUF043", "SIM117"]

[tool.mypy]
python_version = "3.13"
packages = ["crowdent"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "numba.*", "onnxruntime.*", "scipy.*"]
ignore_missing_imports = true
